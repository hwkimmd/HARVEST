
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harvest-rare26"
version = "0.1.0"
description = "MIT-licensed HARVEST implementation for the RARE26 challenge"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
[project.urls]
Repository = "https://github.com/hwkimmd/HARVEST"

dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "Pillow>=10.0",
  "scikit-learn>=1.3",
  "torch>=2.4",
  "torchvision>=0.19",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
curation = ["faiss-cpu>=1.8", "pyarrow>=15.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
